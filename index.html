    <style>
        :root {

            width: 100%;

            margin: 0 auto;

        /* STARFIELD ANIMATION */
        .stars, .stars-md {
            position: absolute;
            top: 0; left: 0;
            border-radius: 50%;
            background: transparent;
            pointer-events: none;
        }

        .stars {
            width: 1px; height: 1px;

            from { transform: translateY(0); }
            to   { transform: translateY(-600px); }

        /* HEADER */
        .header {
            text-align: center;
            padding: 80px 0 45px;

            position: relative;
            overflow: hidden;
        }

        .header__title {

            font-family: var(--font-headline);
            font-size: clamp(1rem, 2vw, 1.rem);

            margin-bottom: 25px;
        }

        .header-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--primary);
            color: var(--on-primary);
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(255, 186, 56, 0.2);
        }

        .header-btn:hover {
            background: var(--primary-fixed);
            transform: translateY(-2px);
        }

        /* INPUT SECTIONS */
        .input-section {
            padding: 30px 0;
        }

        .input-card {
            background: var(--surface-container);
            border: 1px solid var(--outline-variant);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 25px;
        }

        .input-label {
            display: block;
            font-family: var(--font-headline);
            font-size: 1.2rem;
            font-weight: 700;
            font-style: italic;
            margin-bottom: 12px;
            color: var(--primary-fixed);
        }

        .main-textarea {
            width: 100%;
            min-height: 120px;
            background: var(--surface-container-lowest);
            border: 1px solid var(--outline-variant);
            border-radius: 12px;
            color: var(--on-surface);
            padding: 15px;
            font-family: var(--font-label);
            font-size: 1rem;
            resize: vertical;
        }

        .main-textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* PROMPT CARDS */
        .prompt-card {
            background: var(--surface-container);
            border: 1px solid var(--outline-variant);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 40px;
        }

        .prompt-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .prompt-number {
            background: var(--primary);
            color: var(--on-primary);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .prompt-title {
            font-family: var(--font-headline);
            font-size: 1.5rem;
            font-weight: 700;
            font-style: italic;
        }

        .prompt-textarea {
            width: 100%;
            min-height: 450px;
            background: var(--surface-container-lowest);
            border: 1px solid var(--outline-variant);
            border-radius: 12px;
            color: var(--on-surface);
            padding: 20px;
            font-family: var(--font-label);
            font-size: 0.95rem;
            line-height: 1.6;
            resize: vertical;
            white-space: pre-wrap;
            margin-bottom: 20px;
        }

        .copy-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--primary);
            color: var(--on-primary);
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .copy-button:hover {
            background: var(--primary-fixed);
            transform: scale(1.02);
        }

        .copy-button.copied {
            background: var(--green);
            color: #fff;
        }

        /* FOOTER */
        .footer {
            text-align: center;
            padding: 60px 0;
            border-top: 1px solid var(--outline-variant);
            color: var(--on-surface-variant);
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .header__title { font-size: 2rem; }
            .prompt-card, .input-card { padding: 20px; }
        }

<body>

    <div class="stars-md"></div>

    <div class="container">
        
        <!-- DYNAMIC INPUT FIELDS -->
        <section class="input-section">
            
            <div class="input-card">
                <label class="input-label">[Dumb Doc]</label>
                <textarea id="dumbDocInput" class="main-textarea dynamic-textarea" placeholder="Paste or type [Dumb Doc] here..."></textarea>
            </div>

            <div class="input-card">
                <label class="input-label">[Requirement]</label>
                <textarea id="requirementInput" class="main-textarea dynamic-textarea" placeholder="Paste or type [Requirement] here..."></textarea>
            </div>

        </section>

        <!-- PROMPT -->
        <div class="prompt-card">
            <div class="prompt-header">
                <div class="prompt-number">1</div>
                <h2 class="prompt-title">Prompt</h2>
            </div>
            <textarea id="promptOutput" class="prompt-textarea" readonly></textarea>
            <button class="copy-button" onclick="copyPrompt(this)">Copy Prompt</button>
        </div>

    </div>

    <footer class="footer">

        </div>

    <script>
        const dumbDocInput = document.getElementById("dumbDocInput");
        const requirementInput = document.getElementById("requirementInput");
        const promptOutput = document.getElementById("promptOutput");

        // Template generator function
        function updatePrompt() {
            const dumbDoc = dumbDocInput.value.trim() || "[Dumb Doc]";
            const requirement = requirementInput.value.trim() || "[Requirement]";

            promptOutput.value = `${dumbDoc}

উপরের এই টেক্সট-র ভিত্তিতে আমি একটা কনটেন্ট লিখবো।

CONTENT TYPE:
 
Question-Driven Actuality Unfolding through Reasoning, in the conversational mode of “One-to-One Intellectual Conversation”

RULES (MANDATORY)

Core Content Development System:

Topic (Reader যে লোকবিশ্বাস, লোকসংস্কৃতি ও লোকাচারের ভিত্তিতে জীবনকে দেখছে এবং যাকে সে সত্য বলে গ্রহণ করছে।)
 ↓
Content Task (১. Reader যে বিষয়টিকে সত্য বলে ভ্রম করছে, সেটি আসলে তার জন্য মিথ্যা ও আত্মঘাতী—তা establish করা। ২. প্রকৃত সত্য কী, তা reveal করা এবং কেন সেটিই প্রকৃত সত্য—তা establish করা।)
 ↓
Objective (Reader-এর অনুভবে এই উপলব্ধি জাগানো যে, যাকে সে সত্য বলে ভ্রম করছে, সেটিই আসলে তার জন্য মিথ্যা ও আত্মঘাতী।)
 ↓
Expected Outcome (Reader নিজের বিশ্বাসের মধ্যে থাকা সেই ভুলটি চিনতে ও তার মারক/ঘাতক চরিত্র বুঝতে পারে এবং লোকবিশ্বাস ও লোকসংস্কৃতির সেই ধাঁধা থেকে নিজেকে আলাদা করে নিতে পারে—ফলে তার হারানো শান্তি, আনন্দ ও সুখ ফিরে পাওয়ার সুযোগ তৈরি হয়।)

Reason Unfolding Strategy:

আমার উদ্দেশ্য argument-কে unfold না করে সরাসরি conclusion-কে reader-এর সামনে পৌঁছে দেওয়া নয়।
আমি কোনওভাবেই চাই না content-টি শেষ পর্যন্ত একটি উপদেশমূলক framework-এ পরিণত হোক।
আমার কাজের মূল বৈশিষ্ট্য ও শক্তি হল—একটি প্রশ্ন থেকে পরবর্তী প্রশ্নকে logically necessary করে তোলা।
আমার কাঙ্ক্ষিত পদ্ধতি হল:
প্রতিটি ধাপে reader-কে এমন একটি অবস্থায় নিয়ে যেতে হবে যেখানে আগের explanation আর পরবর্তী প্রশ্নের উত্তর দেওয়ার জন্য পুরোপুরি যথেষ্ট থাকে না। সেই insufficiency থেকেই পরবর্তী প্রশ্নের প্রয়োজন তৈরি হবে।
অর্থাৎ:
প্রতিটি assertion-এর আগে তার প্রয়োজনীয় reasoning তৈরি হবে।
প্রতিটি নতুন concept তখনই আসবে, যখন আগের reasoning সেটিকে logically necessary করে তুলবে।
প্রতিটি answer এমনভাবে তৈরি হবে, যাতে তার মধ্য থেকেই পরবর্তী necessary question-এর জন্ম হয়।
ফলে content-এর নতুন chapter/section শুধুমাত্র topic পরিবর্তনের কারণে শুরু হবে না। আগের chapter/section-এর explanation যখন পরবর্তী প্রশ্নের উত্তর দেওয়ার জন্য আর যথেষ্ট থাকবে না, তখন সেই insufficiency থেকে যে প্রশ্নটি স্বাভাবিকভাবে উঠে আসবে, সেই প্রশ্নই পরবর্তী chapter/section-এর জন্ম দেবে।
আমার লক্ষ্য হল reader-কে এমন একটি intellectual journey-র মধ্যে দিয়ে নিয়ে যাওয়া, যার শেষে reader নিজেই বলতে পারেন:
“আচ্ছা, তাহলে ব্যাপারটা এখানে!”
এটাই আমার কাছে One-to-One Intellectual Conversation-এর আরও গভীর অর্থ।

TASK

আমাকে এই proposed content-এর জন্য যেটা ${requirement}, আলোচনার মাধ্যমে তা বিশ্লেষণ ও identify করতে সাহায্য করুন।`;
        }

        // Auto-Resize logic for Textareas
        const tx = document.querySelectorAll(".dynamic-textarea");
        tx.forEach(textarea => {
            textarea.addEventListener("input", function() {
                this.style.height = "auto";
                this.style.height = this.scrollHeight + "px";
                updatePrompt();
            });
        });

        // Initialize template on page load
        updatePrompt();

        // Modern clipboard copy with legacy fallback
        async function copyPrompt(button) {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(promptOutput.value);
                } else {
                    promptOutput.select();
                    promptOutput.setSelectionRange(0, 99999);
                    document.execCommand('copy');
                    window.getSelection().removeAllRanges();
                }

                const originalText = button.innerHTML;
                button.innerHTML = '&#10003; Copied!';
                button.classList.add('copied');

                setTimeout(() => {
                    button.innerHTML = originalText;
                    button.classList.remove('copied');
                }, 2000);
            } catch (err) {
                console.error('Copy failed', err);
            }
        }
    </script>

</body>
